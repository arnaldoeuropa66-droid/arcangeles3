<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Cancelar suscripción — Ángeles de Luz</title>
  <meta name="description" content="Cancela tu suscripción a Ángeles de Luz en cualquier momento. Sin compromiso, sin coste.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://angeles-de-luz.arnaldoeuropa66.workers.dev/pages/baja.html">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">

  <style>
    .baja-page {
      min-height: 100vh;
      padding: var(--space-2xl) 0;
    }

    .baja-container {
      max-width: 560px;
      margin: 0 auto;
    }

    .baja-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid var(--color-gold);
      border-radius: 20px;
      padding: var(--space-xl);
      box-shadow: 0 10px 40px rgba(201, 169, 97, 0.2);
      position: relative;
    }

    .baja-header {
      text-align: center;
      margin-bottom: var(--space-xl);
    }

    .baja-icon {
      font-size: 3rem;
      margin-bottom: var(--space-sm);
    }

    .baja-header h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      color: #ffffff;
      margin-bottom: var(--space-xs);
      line-height: 1.2;
    }

    .baja-header p {
      color: var(--color-text-muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    .baja-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group label {
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .form-group label .requerido {
      color: var(--color-gold-light);
    }

    .form-group input[type="email"] {
      width: 100%;
      padding: 0.85rem 1rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(201, 169, 97, 0.3);
      border-radius: 10px;
      color: #ffffff;
      font-family: inherit;
      font-size: 1rem;
      transition: all 0.25s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--color-gold);
      box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.15);
      background: rgba(15, 23, 42, 0.8);
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 1rem;
      background: rgba(201, 169, 97, 0.05);
      border: 1px solid rgba(201, 169, 97, 0.2);
      border-radius: 10px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      accent-color: var(--color-gold);
      cursor: pointer;
      flex-shrink: 0;
    }

    .checkbox-group label {
      color: var(--color-text);
      font-size: 0.9rem;
      line-height: 1.5;
      cursor: pointer;
      font-weight: 400;
    }

    .btn-baja {
      padding: 1.1rem 2rem;
      background: transparent;
      color: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: var(--space-sm);
    }

    .btn-baja:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
      border-color: #ffffff;
      transform: translateY(-2px);
    }

    .btn-baja:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .form-mensaje {
      padding: 1rem;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.5;
      display: none;
      margin-top: var(--space-sm);
    }

    .form-mensaje.exito {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
      display: block;
    }

    .form-mensaje.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      display: block;
    }

    .form-mensaje.info {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
      display: block;
    }

    .baja-info {
      margin-top: var(--space-lg);
      padding-top: var(--space-md);
      border-top: 1px solid rgba(201, 169, 97, 0.2);
      text-align: center;
      font-size: 0.9rem;
      color: var(--color-text-muted);
      line-height: 1.6;
    }

    .baja-info a {
      color: var(--color-gold-light);
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      .baja-card {
        padding: var(--space-md);
      }
    }
  </style>
</head>
<body>

  <div class="ethereal-bg" aria-hidden="true">
    <div class="ethereal-glow glow-1"></div>
    <div class="ethereal-glow glow-2"></div>
  </div>

  <main class="baja-page">
    <div class="container">
      <div class="baja-container">
        <a href="/" class="legal-back">← Volver al inicio</a>

        <div class="baja-card">
          <div class="baja-header">
            <div class="baja-icon">🕊️</div>
            <h1>Cancelar suscripción</h1>
            <p>Lamentamos verte partir. Si confirmas la baja, dejarás de recibir los mensajes diarios inmediatamente.</p>
          </div>

          <form class="baja-form" id="formBaja" novalidate>

            <div class="form-group">
              <label for="email">Tu email <span class="requerido">*</span></label>
              <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="tu@email.com"
                required
                autocomplete="email">
            </div>

            <div class="checkbox-group">
              <input type="checkbox" id="confirmar" name="confirmar" required>
              <label for="confirmar">
                Confirmo que quiero cancelar mi suscripción a Ángeles de Luz. <span class="requerido">*</span>
              </label>
            </div>

            <button type="submit" class="btn-baja" id="btnBaja">
              Confirmar baja
            </button>

            <div class="form-mensaje" id="formMensaje" role="alert" aria-live="polite"></div>

          </form>

          <p class="baja-info">
            ¿Prefieres escribirnos directamente? <a href="mailto:efectobermuabh@proton.me?subject=Cancelar%20suscripci%C3%B3n">Envíanos un correo</a>
          </p>

        </div>
      </div>
    </div>
  </main>

  <script>
    (function() {
      const form = document.getElementById('formBaja');
      const btn = document.getElementById('btnBaja');
      const mensaje = document.getElementById('formMensaje');

      if (!form) return;

      function mostrarMensaje(texto, tipo) {
        mensaje.textContent = texto;
        mensaje.className = 'form-mensaje ' + tipo;
      }

      function limpiarMensaje() {
        mensaje.className = 'form-mensaje';
        mensaje.textContent = '';
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        limpiarMensaje();

        const email = form.email.value.trim();
        const confirmar = form.confirmar.checked;

        // Validaciones
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          mostrarMensaje('⚠️ Por favor, introduce un email válido.', 'error');
          form.email.focus();
          return;
        }

        if (!confirmar) {
          mostrarMensaje('⚠️ Debes confirmar que quieres cancelar la suscripción.', 'error');
          form.confirmar.focus();
          return;
        }

        // Estado de carga
        btn.disabled = true;
        btn.innerHTML = '⏳ Procesando...';

        try {
          const respuesta = await fetch('/api/baja', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });

          const resultado = await respuesta.json();

          if (resultado.status === 'ok') {
            mostrarMensaje('✅ ' + resultado.mensaje, 'exito');
            form.reset();
            mensaje.scrollIntoView({ behavior: 'smooth', block: 'center' });
          } else if (resultado.status === 'no_encontrado') {
            mostrarMensaje('ℹ️ ' + resultado.mensaje, 'info');
          } else {
            mostrarMensaje('❌ ' + (resultado.mensaje || 'Ha ocurrido un error. Inténtalo de nuevo.'), 'error');
          }
        } catch (error) {
          console.error(error);
          mostrarMensaje('❌ No se ha podido conectar con el servidor. Inténtalo de nuevo en unos minutos.', 'error');
        } finally {
          btn.disabled = false;
          btn.innerHTML = 'Confirmar baja';
        }
      });
    })();
  </script>

  <script src="/assets/script.js" defer></script>
  <script src="/assets/cookie-banner.js" defer></script>
</body>
</html>
